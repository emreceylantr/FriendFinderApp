<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Paneli - Kullanıcılar</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
        td:last-child form {
            display: inline;
        }
        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .admin-header {
            color: #4CAF50;
            font-size: 24px;
            text-transform: uppercase;
            font-weight: bold;
            margin-left: 20px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        button.delete {
            background-color: #f44336; /* Kırmızı renk */
        }
        button.delete:hover {
            background-color: #e53935; /* Koyu kırmızı */
        }
    </style>
</head>
<body>
<h2 class="admin-header">Admin Paneli</h2>
<h2 style="text-align: center;">Kullanıcılar</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Kullanıcı Adı</th>
        <th>Ad</th>
        <th>Soyad</th>
        <th>Rol</th>
        <th>İşlemler</th>
    </tr>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.username}"></td>
        <td th:text="${u.firstName}"></td>
        <td th:text="${u.lastName}"></td>
        <td th:text="${u.role}"></td>
        <td>
            <!-- Görüntüle -->
            <form th:action="@{'/admin/profile/' + ${u.username}}" method="get">
                <button type="submit">Görüntüle</button>
            </form>

            <!-- Moderatör Yap -->
            <form th:action="@{'/admin/makeModerator/' + ${u.id}}" method="post">
                <button type="submit">Moderatör Yap</button>
            </form>

            <!-- Mesajlar -->
            <form th:action="@{'/admin/messages/' + ${u.username}}" method="get">
                <button type="submit">Mesajlar</button>
            </form>

            <!-- Sil -->
            <form th:action="@{'/admin/deleteUser/' + ${u.id}}" method="post"
                  onsubmit="return confirm('Bu kullanıcıyı silmek istediğinize emin misiniz?');">
                <button class="delete" type="submit">Sil</button>
            </form>
        </td>
    </tr>
</table>
<br/>
<div class="back-link">
    <form th:action="@{/profile}" method="get">
        <button type="submit">← Geri dön</button>
    </form>
</div>
</body>
</html>
