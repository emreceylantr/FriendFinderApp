<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Moderatör Paneli - Kullanıcılar</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 40px;
    }

    .panel-title {
      color: #4CAF50;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 auto;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px 15px;
      text-align: center;
    }

    th {
      background-color: #f0f0f0;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Segoe UI', sans-serif;
    }

    .view-btn {
      background-color: #2196F3;
      color: white;
    }

    .delete-btn {
      background-color: #f44336;
      color: white;
      margin-left: 5px;
    }

    .back-button {
      display: inline-block;
      margin-top: 30px;
      padding: 6px 14px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      font-family: 'Segoe UI', sans-serif;
    }

    .back-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<div class="panel-title">MODERATOR PANELİ</div>

<h2>Kullanıcılar</h2>

<table>
  <tr>
    <th>ID</th>
    <th>Kullanıcı Adı</th>
    <th>Ad</th>
    <th>Soyad</th>
    <th>Rol</th>
    <th>İşlemler</th>
  </tr>
  <tr th:each="u : ${users}">
    <td th:text="${u.id}"></td>
    <td th:text="${u.username}"></td>
    <td th:text="${u.firstName}"></td>
    <td th:text="${u.lastName}"></td>
    <td th:text="${u.role}"></td>
    <td>
      <a th:href="@{/moderator/profile/{username}(username=${u.username})}">
        <button class="view-btn">Görüntüle</button>
      </a>
      <form th:action="@{/moderator/deleteUser/{id}(id=${u.id})}" method="post" style="display:inline;">
        <button class="delete-btn" type="submit" onclick="return confirm('Kullanıcıyı silmek istediğinize emin misiniz?')">Sil</button>
      </form>
    </td>
  </tr>
</table>

<div style="text-align: center;">
  <a th:href="@{/profile}" class="back-button">← Geri Dön</a>
</div>

</body>
</html>
